name: NovaCaris Pilot Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-tests:
    name: Build 46 + Build 47 pilot verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://nova_test:nova_test_password@localhost:5432/novacaris_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova_test
          POSTGRES_PASSWORD: nova_test_password
          POSTGRES_DB: novacaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_test -d novacaris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check pilot source and tests
        run: npm run typecheck:pilot

      - name: Run pilot tests including live PostgreSQL
        run: npm run test:pilot -- --reporter=verbose

      - name: Schema drift check
        run: ./scripts/db/check-schema-drift.sh

      - name: Fresh install of every build, twice (install + in-place upgrade)
        env:
          DATABASE_URL: postgresql://nova_test:nova_test_password@localhost:5432/nova_install
        run: |
          psql postgresql://nova_test:nova_test_password@localhost:5432/postgres -c "CREATE DATABASE nova_install"
          ./scripts/db/install.sh
          ./scripts/db/install.sh

      - name: Clinical chart acceptance tests (SQL, as the restricted app role)
        env:
          DATABASE_URL: postgresql://nova_test:nova_test_password@localhost:5432/nova_install
        run: |
          psql "$DATABASE_URL" -q -f builds/65-clinical-chart-article7/tests/acceptance_tests.sql > /dev/null 2>&1 || true
          psql "$DATABASE_URL" -Atc "SELECT result || '  ' || test FROM nova_test_results ORDER BY n"
          FAILS=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM nova_test_results WHERE result <> 'PASS'")
          TOTAL=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM nova_test_results")
          echo "acceptance: $TOTAL run, $FAILS failed"
          test "$TOTAL" -ge 90 && test "$FAILS" -eq 0
