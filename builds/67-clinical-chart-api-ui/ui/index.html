<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaCärïs Chart</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c2220;--dim:#66706c;--line:#e1dfd7;--accent:#1f5f5b;--accent-ink:#fff;--ok:#1e7a46;--warn:#9a6700;--bad:#b42318;--chip:#edf2f1;--sel:#e3eeec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111413;--panel:#191e1c;--ink:#e6ebe9;--dim:#94a09b;--line:#2a3230;--accent:#6fc3bb;--accent-ink:#0d2422;--ok:#5fd394;--warn:#f0b84c;--bad:#ff8a80;--chip:#1f2a28;--sel:#22302d}}
:root[data-theme=dark]{--bg:#111413;--panel:#191e1c;--ink:#e6ebe9;--dim:#94a09b;--line:#2a3230;--accent:#6fc3bb;--accent-ink:#0d2422;--ok:#5fd394;--warn:#f0b84c;--bad:#ff8a80;--chip:#1f2a28;--sel:#22302d}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}header .who{margin-left:auto;color:var(--dim);font-size:13px}
.layout{display:grid;grid-template-columns:280px 1fr;height:calc(100% - 49px)}
aside{border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
aside .head{padding:12px 14px 6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.res{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;padding:10px 14px;cursor:pointer;font:inherit}
.res:hover{background:var(--chip)}.res[aria-current=true]{background:var(--sel)}
.res b{display:block}.res small{color:var(--dim)}
main{overflow:auto;padding:16px 20px 60px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 16px}
.tabs button{border:0;background:none;color:var(--dim);padding:8px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--chip);color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.ai{color:var(--accent)}
.allergy{border-left:4px solid var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
h2{font-size:20px;margin:4px 0}h3{font-size:15px;margin:0 0 8px}.dim{color:var(--dim)}.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--dim);font-weight:600;font-size:12px}
button.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn.danger{color:var(--bad)}button.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.note-body p{margin:6px 0;white-space:pre-wrap}.note-body .lbl{font-size:12px;color:var(--dim);display:block}
.amend{border-left:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:var(--chip);border-radius:4px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(560px,94vw);padding:18px}
dialog::backdrop{background:rgb(0 0 0/.35)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;display:none;max-width:92vw;z-index:10}
.empty{color:var(--dim);padding:30px;text-align:center}
@media (max-width:760px){.ctable th:nth-child(2),.ctable td:nth-child(2){display:none}header{flex-wrap:wrap}.layout{grid-template-columns:1fr}aside{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}main{padding:12px 16px 60px}}
</style>
</head>
<body>
<header><h1>NovaCärïs Chart</h1><span class="chip">Test environment</span><span class="who" id="who"></span></header>
<div class="layout">
  <aside><div class="head">Residents</div><div id="residents"><div class="empty">Loading…</div></div></aside>
  <main id="main"><div class="empty">Select a resident.</div></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const S = { me:null, residents:[], admissionId:null, tab:"chart", chart:null, mar:null, marDate:new Date().toISOString().slice(0,10), designation:"", token:null };
const $ = (s, el=document) => el.querySelector(s);

// --- safe DOM building (never inject user text as HTML) ---
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===null || v===undefined || v===false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k==="class") el.className = v;
    else el.setAttribute(k, v===true ? "" : String(v));
  }
  for (const kid of kids.flat()){
    if (kid===null || kid===undefined || kid===false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function fill(el, ...kids){ el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display="none",4200); }
const fmtDT = v => v ? new Date(v).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const fmtD = v => v ? new Date(String(v).slice(0,10)+"T12:00:00").toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}) : "";

const FRIENDLY = {
  CHART_LOCKED:"This record is signed and locked. Add an addendum instead.",
  CHART_LOCKED_ALREADY_RECORDED:"That has already been recorded and can't be changed.",
  SIGNATURE_NOT_OWN:"You can only apply your own signature.",
  COSIGN_SELF:"The author can't cosign their own note.",
  ONLY_AUTHOR_CAN_EDIT_DRAFT:"Only the author can edit this draft.",
  ONLY_AUTHOR_CAN_SIGN:"Only the author can sign this note.",
  NOTE_NOT_AWAITING_COSIGN:"This note isn't waiting for a cosign.",
  MAR_ASSESSMENT:"A pre-administration assessment is required for this dose.",
  MAR_UNVERIFIED_ORDER:"This order hasn't been verified yet. It can't be given.",
  MAR_INACTIVE_ORDER:"This order is not active.",
  ADMINISTERED_AT_IN_FUTURE:"The administration time can't be in the future.",
  ADMINISTERED_AT_TOO_OLD_USE_LATE_ENTRY:"More than 24 hours ago — document it as a late entry.",
  VALIDATION_FAILED:"Some required information is missing or invalid.",
  FORBIDDEN:"You don't have access to that.",
  USER_NOT_PROVISIONED:"Your login isn't linked to a staff account in this agency.",
  AUTHENTICATION_REQUIRED:"Please sign in."
};
function explain(err){
  if (!err) return "Something went wrong.";
  const base = String(err.error||"").split(":")[0];
  if (base==="FIELD_REQUIRED") return "Required: " + String(err.error).split(":")[1].replace(/_/g," ");
  if (base==="FIELD_INVALID") return "Check the field: " + String(err.error).split(":")[1].replace(/_/g," ");
  if (base==="POLICY_DENIED") return "Your role isn't allowed to do that.";
  return FRIENDLY[base] || (err.message ? err.message.split(":").slice(1).join(":").trim() || base : base) || "Request failed.";
}

async function api(path, opts={}){
  const headers = {"Content-Type":"application/json"};
  if (S.token) headers.Authorization = "Bearer " + S.token;
  const res = await fetch(path, {credentials:"same-origin", ...opts, headers});
  let body = null; try { body = await res.json(); } catch {}
  if (res.status === 401 && !opts._retried){
    const t = prompt("Paste your access token to continue (kept in this tab only):");
    if (t){ S.token = t.trim(); return api(path, {...opts, _retried:true}); }
  }
  if (!res.ok) throw body || {error:"HTTP_"+res.status};
  return body;
}
const post = (p, b) => api(p, {method:"POST", body:JSON.stringify(b||{})});

// ---------------------------------------------------------------- residents
async function loadResidents(){
  try {
    const [me, list] = await Promise.all([api("/api/chart/me"), api("/api/chart/residents")]);
    S.me = me.item; S.residents = list.items;
    $("#who").textContent = S.me ? `${S.me.display_name||"Staff"} · ${S.me.agency}` : "";
    renderResidents();
  } catch(e){ $("#residents").replaceChildren(h("div",{class:"empty"}, explain(e))); }
}
function renderResidents(){
  const box = $("#residents");
  if (!S.residents.length){ box.replaceChildren(h("div",{class:"empty"},"No active residents.")); return; }
  box.replaceChildren(...S.residents.map(r => h("button",{class:"res","aria-current":String(r.admission_id===S.admissionId),onclick:()=>openResident(r.admission_id)},
    h("b",{}, r.resident_name || "Unnamed resident"),
    h("small",{}, "Admitted " + fmtD(r.admitted_at)), " ",
    Number(r.items_missing) ? h("span",{class:"chip bad"}, r.items_missing + " missing") : null, " ",
    Number(r.items_unsigned) ? h("span",{class:"chip warn"}, r.items_unsigned + " unsigned") : null,
    !Number(r.items_missing) && !Number(r.items_unsigned) ? h("span",{class:"chip ok"},"complete") : null)));
}
async function openResident(id){
  S.admissionId = id; renderResidents();
  await refresh();
}
async function refresh(){
  const main = $("#main");
  try {
    S.chart = (await api(`/api/chart/admissions/${S.admissionId}`)).item;
    if (S.tab==="mar") S.mar = (await api(`/api/chart/admissions/${S.admissionId}/mar?date=${S.marDate}`)).item;
    render();
  } catch(e){ main.replaceChildren(h("div",{class:"empty"}, explain(e))); }
}
function render(){
  const a = S.chart.admission;
  const name = [a.legal_first_name, a.legal_last_name].filter(Boolean).join(" ") || "Unnamed resident";
  const tabs = [["chart","Chart"],["notes","Notes"],["mar","MAR"]];
  fill($("#main"), 
    h("div",{class:"row"}, h("h2",{}, name), a.preferred_name ? h("span",{class:"dim"},`“${a.preferred_name}”`) : null),
    h("div",{class:"dim small"}, `DOB ${fmtD(a.date_of_birth)} · AHCCCS ${a.ahcccs_member_id||"—"} · Admitted ${fmtD(a.admitted_at)} · ${a.admitting_professional_name}, ${a.admitting_professional_credential}`),
    allergyBanner(),
    h("div",{class:"tabs",role:"tablist"}, tabs.map(([k,l]) => h("button",{role:"tab","aria-selected":String(S.tab===k),onclick:async()=>{S.tab=k; if(k==="mar") await refresh(); else render();}}, l))),
    S.tab==="chart" ? viewChart() : S.tab==="notes" ? viewNotes() : viewMar());
}
function allergyBanner(){
  const al = S.chart.allergies;
  if (!al.length) return h("div",{class:"card small",style:"margin-top:10px"}, S.chart.admission.allergies_reviewed ? "No known allergies (reviewed)" : h("span",{class:"chip bad"},"Allergies not yet reviewed"));
  return h("div",{class:"card allergy small",style:"margin-top:10px"}, h("b",{},"Allergies: "), al.map(x=>`${x.allergen}${x.reaction?` (${x.reaction})`:""}`).join(" · "));
}

// ---------------------------------------------------------------- chart (completeness)
const STATUS = {ok:["ok","Complete"],missing:["bad","Missing"],overdue:["bad","Overdue"],needs_signature:["warn","Needs signature"],not_applicable:["","N/A"]};
function viewChart(){
  const rows = S.chart.completeness;
  const open = rows.filter(r => r.status!=="ok" && r.status!=="not_applicable").length;
  return h("div",{},
    h("div",{class:"card"}, h("h3",{}, open ? `${open} Article 7 item(s) need attention` : "Chart is complete"),
      h("div",{style:"overflow-x:auto"}, h("table",{class:"ctable"}, h("thead",{}, h("tr",{}, h("th",{},"Requirement"), h("th",{},"Rule"), h("th",{},"Status"), h("th",{},"Detail"))),
        h("tbody",{}, rows.map(r => { const [cls,label] = STATUS[r.status] || ["",r.status];
          return h("tr",{}, h("td",{}, r.requirement), h("td",{class:"dim small"}, r.citation), h("td",{}, h("span",{class:"chip "+cls}, label)), h("td",{class:"dim small"}, r.detail||"")); }))))),
    h("div",{class:"card small"}, h("b",{},"Admission "), (S.chart.admission.admitting_diagnoses||[]).join(", "), S.chart.admission.presenting_issues ? " — " + S.chart.admission.presenting_issues : ""));
}

// ---------------------------------------------------------------- notes
function noteStatus(n){
  const out = [];
  out.push(n.authenticated_at ? h("span",{class:"chip ok"},"Signed "+fmtDT(n.authenticated_at)) : h("span",{class:"chip warn"},"Draft"));
  if (n.requires_cosign) out.push(n.cosigned_at ? h("span",{class:"chip ok"},`Cosigned · ${n.cosigner_name||""}`) : h("span",{class:"chip warn"},"Awaiting cosign"));
  if (n.ai_drafted) out.push(h("span",{class:"chip ai"},"AI-drafted"));
  if (n.late_entry) out.push(h("span",{class:"chip bad"},"Late entry"));
  return out;
}
function viewNotes(){
  const notes = S.chart.notes;
  const amendBy = {}; for (const m of S.chart.amendments) (amendBy[m.target_id] ||= []).push(m);
  return h("div",{},
    h("div",{class:"row",style:"margin-bottom:12px"}, h("button",{class:"btn primary",onclick:()=>noteDialog()},"New note"),
      h("span",{class:"dim small"},"Signing locks a note. Corrections are added as signed addenda.")),
    notes.length ? notes.map(n => h("div",{class:"card"},
      h("div",{class:"row"}, h("b",{}, n.note_type.replace(/_/g," ")), h("span",{class:"dim small"}, `${fmtD(n.service_date)}${n.start_time?` · ${n.start_time.slice(0,5)}–${(n.end_time||"").slice(0,5)}`:""}${n.service_code?` · ${n.service_code}${n.units?` ×${n.units}`:""}`:""} · ${n.author_name||"staff"}`), ...noteStatus(n)),
      h("div",{class:"note-body"},
        h("p",{}, h("span",{class:"lbl"},"Narrative"), n.narrative),
        n.resident_response ? h("p",{}, h("span",{class:"lbl"},"Resident response"), n.resident_response) : null,
        n.plan_next_steps ? h("p",{}, h("span",{class:"lbl"},"Plan"), n.plan_next_steps) : null),
      (amendBy[n.id]||[]).map(m => h("div",{class:"amend small"}, h("b",{}, m.amendment_type.replace(/_/g," ")), ` · ${m.author_name||""} · ${fmtDT(m.created_at)} — ${m.reason}`, h("div",{}, m.amended_content))),
      h("div",{class:"row",style:"margin-top:8px"},
        !n.authenticated_at && n.mine ? h("button",{class:"btn",onclick:()=>noteDialog(n)},"Edit draft") : null,
        !n.authenticated_at && n.mine ? h("button",{class:"btn primary",onclick:()=>signNote(n)},"Sign") : null,
        n.authenticated_at && n.requires_cosign && !n.cosigned_at && !n.mine ? h("button",{class:"btn primary",onclick:()=>cosign(n)},"Cosign") : null,
        n.authenticated_at ? h("button",{class:"btn",onclick:()=>addendumDialog(n)},"Add addendum") : null)))
    : h("div",{class:"empty"},"No notes yet."));
}
function field(label, input){ return h("div",{}, h("label",{}, label), input); }
function noteDialog(n){
  const d = $("#dlg"); const goals = S.chart.goals;
  const sel = new Set(n?.treatment_plan_goal_ids||[]);
  const types = ["progress","shift","individual_counseling","group_counseling","nursing","psychiatric","case_management","skills_training","health_service","contact","other"];
  const f = {
    note_type: h("select",{}, types.map(t => h("option",{value:t, selected:(n?n.note_type:"progress")===t}, t.replace(/_/g," ")))),
    service_date: h("input",{type:"date",value:(n?.service_date||new Date().toISOString()).slice(0,10)}),
    start_time: h("input",{type:"time",value:n?.start_time?.slice(0,5)||""}),
    end_time: h("input",{type:"time",value:n?.end_time?.slice(0,5)||""}),
    location: h("input",{value:n?.location||""}),
    service_code: h("input",{value:n?.service_code||"",placeholder:"e.g. H2017"}),
    units: h("input",{type:"number",min:"0",step:"0.25",value:n?.units??""}),
    narrative: h("textarea",{required:true}, n?.narrative||""),
    resident_response: h("textarea",{}, n?.resident_response||""),
    plan_next_steps: h("textarea",{style:"min-height:60px"}, n?.plan_next_steps||""),
    requires_cosign: h("input",{type:"checkbox",checked:!!n?.requires_cosign,style:"width:auto"}),
  };
  const goalBoxes = goals.map(g => h("label",{style:"display:flex;gap:6px;color:var(--ink)"}, h("input",{type:"checkbox",value:g.id,checked:sel.has(g.id),style:"width:auto"}), `Goal ${g.goal_number}: ${g.goal}`));
  const save = async (andSign) => {
    const body = {
      note_type:f.note_type.value, service_date:f.service_date.value, start_time:f.start_time.value||null, end_time:f.end_time.value||null,
      location:f.location.value, service_code:f.service_code.value, units:f.units.value===""?null:Number(f.units.value),
      narrative:f.narrative.value, resident_response:f.resident_response.value, plan_next_steps:f.plan_next_steps.value,
      requires_cosign:f.requires_cosign.checked, ai_drafted:!!n?.ai_drafted,
      treatment_plan_goal_ids: goalBoxes.map(l=>l.querySelector("input")).filter(i=>i.checked).map(i=>i.value)
    };
    if (body.narrative.trim().length < 20) return toast("The narrative needs at least 20 characters.");
    try {
      const r = n ? await post(`/api/chart/notes/${n.id}`, body) : await post(`/api/chart/admissions/${S.admissionId}/notes`, body);
      if (andSign){ if (!confirm("Sign this note? It will be locked and can only be corrected by addendum.")) { d.close(); return refresh(); }
        await post(`/api/chart/notes/${(n||r.item).id}/sign`); }
      d.close(); toast(andSign ? "Note signed." : "Draft saved."); refresh();
    } catch(e){ toast(explain(e)); }
  };
  fill(d, h("h3",{}, n ? "Edit draft note" : "New note"),
    h("div",{class:"grid"}, field("Type",f.note_type), field("Service date",f.service_date), field("Start",f.start_time), field("End",f.end_time), field("Service code",f.service_code), field("Units",f.units)),
    field("Location",f.location),
    goals.length ? h("div",{}, h("label",{},"Treatment plan goals addressed"), goalBoxes) : null,
    field("What happened / interventions provided",f.narrative), field("Resident response / progress toward goals",f.resident_response), field("Plan / next steps",f.plan_next_steps),
    h("label",{style:"display:flex;gap:6px;align-items:center;color:var(--ink)"}, f.requires_cosign, "Requires supervisor cosign"),
    h("div",{class:"row",style:"margin-top:14px;justify-content:flex-end"},
      h("button",{class:"btn",onclick:()=>d.close()},"Cancel"), h("button",{class:"btn",onclick:()=>save(false)},"Save draft"), h("button",{class:"btn primary",onclick:()=>save(true)},"Save & sign")));
  d.showModal();
}
async function signNote(n){
  if (!confirm("Sign this note? It will be locked and can only be corrected by addendum.")) return;
  try { await post(`/api/chart/notes/${n.id}/sign`); toast("Note signed."); refresh(); } catch(e){ toast(explain(e)); }
}
async function cosign(n){
  if (!confirm("Cosign this note as the supervising staff member?")) return;
  try { await post(`/api/chart/notes/${n.id}/cosign`); toast("Cosigned."); refresh(); } catch(e){ toast(explain(e)); }
}
function addendumDialog(n){
  const d = $("#dlg");
  const type = h("select",{}, [["addendum","Addendum"],["correction","Correction"],["late_entry","Late entry"],["entered_in_error","Entered in error"]].map(([v,l])=>h("option",{value:v},l)));
  const reason = h("input",{placeholder:"Why this is being added"}); const content = h("textarea",{});
  fill(d, h("h3",{},"Addendum to signed note"), h("p",{class:"dim small"},"The original note stays unchanged. This addendum is signed by you when saved."),
    field("Type",type), field("Reason",reason), field("Addendum text",content),
    h("div",{class:"row",style:"margin-top:14px;justify-content:flex-end"}, h("button",{class:"btn",onclick:()=>d.close()},"Cancel"),
      h("button",{class:"btn primary",onclick:async()=>{ try { await post(`/api/chart/notes/${n.id}/addendum`,{amendment_type:type.value,reason:reason.value,amended_content:content.value}); d.close(); toast("Addendum signed and saved."); refresh(); } catch(e){ toast(explain(e)); } }},"Sign & save")));
  d.showModal();
}

// ---------------------------------------------------------------- MAR pass
function viewMar(){
  const m = S.mar; if (!m) return h("div",{class:"empty"},"Loading MAR…");
  const byOrder = {}; for (const x of m.administrations) (byOrder[x.medication_order_id] ||= []).push(x);
  const date = h("input",{type:"date",value:S.marDate,style:"width:auto",onchange:async e=>{S.marDate=e.target.value; await refresh();}});
  const sched = m.orders.filter(o=>!o.is_prn), prn = m.orders.filter(o=>o.is_prn);
  const adminLine = x => h("div",{class:"small"},
    h("span",{class:"chip "+(x.outcome==="given"||x.outcome==="self_administered_with_assistance"?"ok":"warn")}, x.outcome.replace(/_/g," ")),
    ` ${fmtDT(x.administered_at)} · ${x.dose_given} ${x.route} · ${x.administered_by_name}, ${x.professional_designation}`,
    x.reason_not_given ? ` — ${x.reason_not_given}` : "",
    x.pre_behavior_assessment ? h("div",{class:"dim"},"Before: "+x.pre_behavior_assessment) : null,
    x.pre_pain_assessment ? h("div",{class:"dim"},"Pain before: "+x.pre_pain_assessment) : null,
    x.effect_assessment ? h("div",{class:"dim"},`Effect (${fmtDT(x.effect_assessed_at)}): ${x.effect_assessment}`) : null,
    x.adverse_reaction ? h("div",{style:"color:var(--bad)"},"Adverse reaction: "+x.adverse_reaction) : null,
    (!x.effect_assessment || !x.adverse_reaction) && (x.outcome==="given"||x.outcome==="self_administered_with_assistance")
      ? h("button",{class:"btn",style:"margin-top:4px",onclick:()=>effectDialog(x)}, x.effect_assessment ? "Record adverse reaction" : "Record effect") : null);
  const medHead = o => h("div",{}, h("b",{}, `${o.medication_name} ${o.strength}`), h("span",{class:"dim small"}, ` ${o.dose} ${o.route} · ${o.frequency}`),
    o.is_psychotropic ? h("span",{class:"chip",style:"margin-left:6px"},"psychotropic") : null, o.is_pain_medication ? h("span",{class:"chip",style:"margin-left:6px"},"pain") : null,
    !o.verified ? h("span",{class:"chip bad",style:"margin-left:6px"},"not verified") : null);
  return h("div",{},
    h("div",{class:"row",style:"margin-bottom:12px"}, h("label",{style:"margin:0"},"Date"), date, h("span",{class:"dim small"},"Each entry is signed by you and locked when saved.")),
    h("div",{class:"card"}, h("h3",{},"Scheduled"), sched.length ? h("table",{}, h("tbody",{}, sched.flatMap(o => {
      const done = byOrder[o.id]||[]; const times = (o.scheduled_times||[]).length ? o.scheduled_times : [null];
      const hhmm = v => v ? new Date(v).toTimeString().slice(0,5) : "";
      return times.map(t => { const rec = t ? done.find(x => hhmm(x.scheduled_for) === t.slice(0,5)) : done[0];
        return h("tr",{}, h("td",{style:"width:70px"}, h("b",{}, t ? t.slice(0,5) : "—")), h("td",{}, medHead(o), rec ? adminLine(rec) : null),
          h("td",{style:"width:110px;text-align:right"}, rec ? h("span",{class:"chip ok"},"documented") : h("button",{class:"btn primary",disabled:!o.verified,onclick:()=>giveDialog(o,t)},"Record"))); });
    }))) : h("div",{class:"dim"},"No scheduled medications.")),
    h("div",{class:"card"}, h("h3",{},"PRN (as needed)"), prn.length ? prn.map(o => { const done = (byOrder[o.id]||[]).filter(x=>x.outcome==="given"||x.outcome==="self_administered_with_assistance");
      return h("div",{style:"border-bottom:1px solid var(--line);padding:8px 0"}, h("div",{class:"row"}, medHead(o),
          h("span",{class:"dim small"}, `for ${o.prn_indication}${o.prn_max_doses_per_day?` · max ${o.prn_max_doses_per_day}/day · given ${done.length} today`:""}`),
          h("button",{class:"btn primary",style:"margin-left:auto",disabled:!o.verified || (o.prn_max_doses_per_day && done.length>=o.prn_max_doses_per_day),onclick:()=>giveDialog(o,null)},"Give PRN")),
        (byOrder[o.id]||[]).map(adminLine)); }) : h("div",{class:"dim"},"No PRN orders.")));
}
function giveDialog(o, time){
  const d = $("#dlg");
  const first = !(S.mar.administrations.some(x => x.medication_order_id===o.id));
  const needBehavior = o.is_psychotropic && (o.is_prn || first);
  const needPain = o.is_pain_medication && (o.is_prn || first);
  const outcome = h("select",{}, [["given","Given"],["self_administered_with_assistance","Self-administered with assistance"],["refused","Refused"],["held","Held"],["missed","Missed"],["not_available","Not available"]].map(([v,l])=>h("option",{value:v},l)));
  const dose = h("input",{value:o.dose}); const route = h("input",{value:o.route});
  const reason = h("input",{placeholder:"Required if not given"});
  const behavior = h("textarea",{placeholder:"Observed behavior/symptoms before giving"});
  const pain = h("textarea",{placeholder:"Pain rating and description before giving"});
  const desig = h("input",{value:S.designation,placeholder:"RN, LPN, BHT…"});
  const save = async () => {
    const given = outcome.value==="given" || outcome.value==="self_administered_with_assistance";
    if (given && needBehavior && !behavior.value.trim()) return toast("Behavior assessment is required before this dose.");
    if (given && needPain && !pain.value.trim()) return toast("Pain assessment is required before this dose.");
    if (!given && !reason.value.trim()) return toast("Give a reason the dose wasn't given.");
    S.designation = desig.value.trim();
    let scheduled = null; if (time){ const dt = new Date(S.marDate+"T"+time.slice(0,5)); scheduled = dt.toISOString(); }
    try {
      await post("/api/chart/mar", { medication_order_id:o.id, outcome:outcome.value, dose_given:given?dose.value:"0", route:route.value,
        reason_not_given:reason.value, pre_behavior_assessment:behavior.value, pre_pain_assessment:pain.value, professional_designation:desig.value, scheduled_for:scheduled });
      d.close(); toast("Administration signed and recorded."); refresh();
    } catch(e){ toast(explain(e)); }
  };
  fill(d, h("h3",{}, `${o.medication_name} ${o.strength}${time?` · ${time.slice(0,5)}`:" · PRN"}`),
    o.is_prn ? h("p",{class:"dim small"},"Indication: "+o.prn_indication) : null,
    S.chart.allergies.length ? h("div",{class:"card allergy small"}, "Allergies: "+S.chart.allergies.map(a=>a.allergen).join(", ")) : null,
    h("div",{class:"grid"}, field("Outcome",outcome), field("Dose given",dose), field("Route",route), field("Your designation",desig)),
    field("Reason not given",reason),
    needBehavior ? field("Behavior assessment before dose (required)",behavior) : null,
    needPain ? field("Pain assessment before dose (required)",pain) : null,
    h("p",{class:"dim small"},"Saving records the current time and your signature. The entry is then locked."),
    h("div",{class:"row",style:"justify-content:flex-end"}, h("button",{class:"btn",onclick:()=>d.close()},"Cancel"), h("button",{class:"btn primary",onclick:save},"Sign & record")));
  d.showModal();
}
function effectDialog(x){
  const d = $("#dlg");
  const eff = h("textarea",{placeholder:"Effect observed (e.g., calmer after 45 min, anxiety 3/10)"}); const adv = h("textarea",{placeholder:"Only if a reaction occurred"});
  fill(d, h("h3",{},"Follow-up"), h("p",{class:"dim small"},"Each can be recorded once and is then locked."),
    !x.effect_assessment ? field("Effect",eff) : null, !x.adverse_reaction ? field("Adverse reaction",adv) : null,
    h("div",{class:"row",style:"justify-content:flex-end;margin-top:12px"}, h("button",{class:"btn",onclick:()=>d.close()},"Cancel"),
      h("button",{class:"btn primary",onclick:async()=>{ try { await post(`/api/chart/mar/${x.id}/effect`,{effect_assessment:x.effect_assessment?null:eff.value, adverse_reaction:x.adverse_reaction?null:adv.value}); d.close(); toast("Recorded."); refresh(); } catch(e){ toast(explain(e)); } }},"Save")));
  d.showModal();
}

loadResidents();
</script>
